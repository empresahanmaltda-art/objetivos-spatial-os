<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#202225" />
  <meta name="description" content="OBJETIVOS — tarefas e metas com prazo em um espaço pessoal simples e inteligente." />
  <link rel="manifest" href="manifest.webmanifest?v=4" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <title>OBJETIVOS — Spatial OS</title>
</head>
<body>
  <div class="environment" aria-hidden="true">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="grain"></div>
  </div>

  <div class="app-shell" id="appShell">
    <header class="topbar glass">
      <button class="brand-button" data-view="today" aria-label="Abrir tarefas de hoje">
        <span class="brand-tile"><span>OS</span></span>
        <span class="brand-copy"><strong>OBJETIVOS</strong><small>Spatial OS</small></span>
      </button>

      <div class="top-actions">
        <span class="save-state" id="syncStatus"><i></i><span>salvo neste aparelho</span></span>
        <button class="assistant-trigger" id="commandBtn" type="button" aria-label="Abrir assistente">
          <span class="spark">✦</span><span>Pedir ou executar</span>
        </button>
        <button class="icon-button" id="settingsBtn" type="button" aria-label="Configurações">•••</button>
      </div>
    </header>

    <main id="viewRoot" class="workspace glass" tabindex="-1"></main>

    <button class="quick-add" id="quickAdd" type="button" aria-label="Adicionar tarefa">+</button>
    <nav class="bottom-dock glass" id="bottomDock" aria-label="Navegação principal"></nav>
  </div>

  <div id="modalLayer" class="modal-layer" aria-live="polite"></div>
  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
  <script src="app.js?v=4"></script>
</body>
</html>
